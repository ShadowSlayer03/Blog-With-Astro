name: Sync blog assets to R2

on:
  push:
    branches:
      - main
    paths:
      - 'public/images/blog/**'
      - 'src/content/blog/**/content/**'
      - 'src/content/blog/**/*.mdoc'

  workflow_dispatch:

concurrency:
  group: sync-blog-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    # Prevent infinite loops
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Run asset sync script
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
        run: python .github/scripts/sync_assets.py
