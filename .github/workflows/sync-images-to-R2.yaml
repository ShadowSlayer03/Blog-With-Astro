name: Sync blog images to R2

on:
  push:
    branches: [main]
    paths:
      - 'public/images/blog/**'

# Prevent a second run if two pushes queue up simultaneously
concurrency:
  group: sync-images-to-r2
  cancel-in-progress: false

# Needed so the bot can push the URL-replacement commit back
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # Skip if the last commit was the bot's own commit
    if: "!contains(github.event.head_commit.message, 'chore: migrate blog images to R2')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Run image sync script
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
        run: bash .github/scripts/sync-images-to-r2.sh